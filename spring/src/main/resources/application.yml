server:
  port: 8080

# MQTT 配置
mqtt:
  broker-url: tcp://broker.emqx.io:1883
  client-id-prefix: spring-mqtt-
  username: emqx
  password: public
  default-topic: test/topic
  qos: 1

# Redis 配置
spring:
  application:
    name: mqtt-demo
  # Excel 导入文件上传大小限制（Spring Boot 默认单文件 1MB，偏小）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0