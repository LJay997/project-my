apiVersion: v1
kind: Pod
metadata:
  name: load-test
spec:
  containers:
  - name: load-test
    image: busybox
    command: ["sh", "-c", "while true; do wget -q -O /dev/null http://cpu-test-app:8080/cpu/busy?iterations=10000000; sleep 0.1; done"]
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "128Mi"